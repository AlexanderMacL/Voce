name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Test core library
        run: dotnet test tests/Voce.Core.Tests/Voce.Core.Tests.csproj -c Release

      # Full MSBuild is used for the WinUI app: the XAML compiler fails silently under the dotnet CLI.
      - name: Publish portable app (win-x64)
        run: >
          msbuild src/Voce.App/Voce.App.csproj /restore /t:Publish
          /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64
          /p:PublishDir=${{ github.workspace }}\publish\Voce\
          /v:minimal /nologo

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: Voce-win-x64
          path: publish/Voce
